name: chatforge

# Local dev stack + deployable services. Every secret/URL falls back to a dev default but is
# overridable via env — set real values in Dokploy (Compose → Environment) for production.
# `docker compose up` runs everything with the dev defaults; or run only postgres/minio/mailpit
# and use `npm run dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatforge}
      POSTGRES_DB: ${POSTGRES_DB:-chatforge}
    ports: ['5432:5432']
    volumes: ['./.data/postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-chatforge}']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    # Dev-only (object storage for attachments, CH-5). Not started in prod — saves memory.
    # Run locally with: docker compose --profile dev up
    profiles: ['dev']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chatforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chatforge123}
    ports: ['9000:9000', '9001:9001']
    volumes: ['./.data/minio:/data']

  mailpit:
    image: axllent/mailpit:latest
    # Dev-only (local SMTP capture). Not started in prod.
    profiles: ['dev']
    ports: ['1025:1025', '8025:8025']

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      PORT: 8787
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4321}
      DATABASE_URL: ${DATABASE_URL:-postgres://chatforge:chatforge@postgres:5432/chatforge}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-insecure-secret-change-in-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8787}
      PASSKEY_RPID: ${PASSKEY_RPID:-localhost}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:-http://localhost:4321}
      # First-run owner — seeded only if no owner exists; inert once you change it in the panel.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-chatforge}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    ports: ['8787:8787']
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports: ['4321:8080']
    depends_on: [api]
