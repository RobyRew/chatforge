# Disposable CI-only overrides; never use with a production project or volume.
services:
  garage:
    ports: ['127.0.0.1:13900:3900']
    healthcheck:
      interval: 5s
      start_period: 5s
  postgres:
    healthcheck:
      interval: 5s
      start_period: 5s
  api:
    healthcheck:
      interval: 5s
      start_period: 5s
  web:
    ports: ['127.0.0.1:18980:8080']
    healthcheck:
      interval: 5s
      start_period: 5s

# Docker does not bind a published port for a container whose only network is
# `internal`, so the storage-contract test could never reach 127.0.0.1:13900
# (run 35534610742: ECONNREFUSED). The disposable CI stack lifts `internal`
# on the storage network; production keeps it and the checker enforces that.
networks:
  storage:
    internal: false
