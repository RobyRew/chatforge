# ChatForge SPA — nginx-unprivileged (binds :8080, runs as uid 101).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Conversion + crypto run in a Web Worker; everything else is same-origin. Append the API
    # origin to connect-src at deploy time once the web app talks to @chatforge/api.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # --- Caching ---
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin API + WebSocket. In docker-compose, nginx proxies to the `api` service so the
    # session cookie + ws are same-origin. In Dokploy/Traefik, /api + /ws are path-routed to the
    # API *before* reaching nginx, so these blocks are simply never hit there. The resolver +
    # variable upstream keep nginx booting even when `api` doesn't resolve (Dokploy app split).
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8787;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        set $ws_upstream http://api:8787;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
