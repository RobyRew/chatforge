name: Bump chat-converter

# Moves ChatForge to the newest vX.Y.Z tag of RobyRew/chat-converter (ADR-0031): updates the pin in
# @chatforge/types, @chatforge/web and @chatforge/api, re-locks, runs the checks of build-images.yml and,
# when they pass, commits to main and dispatches build-images.yml (a push made with GITHUB_TOKEN starts no
# workflow by itself). Deploying stays manual (ADR-0028).

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-chat-converter
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund

      - name: Compare the pinned tag with the newest one
        id: tags
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/RobyRew/chat-converter.git 'v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          current=$(node -p "require('./packages/types/package.json').dependencies['@robyrew/chat-converter'].split('#')[1] ?? ''")
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)
          echo "pinned ${current:-none}, newest tag ${latest:-none}"
          if [ -n "$latest" ] && [ "$latest" != "$current" ] && [ "$newest" = "$latest" ]; then
            echo "tag=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Move the pins and re-lock
        if: steps.tags.outputs.tag != ''
        env:
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          node -e '
            const fs = require("node:fs");
            for (const f of ["packages/types/package.json", "apps/web/package.json", "apps/api/package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.dependencies["@robyrew/chat-converter"] = `github:RobyRew/chat-converter#${process.env.TAG}`;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }'
          npm install --ignore-scripts --no-audit --no-fund
          # After a git spec changes, npm installs one copy per workspace; dedupe hoists them back to one.
          npm dedupe --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the checks of build-images.yml
        if: steps.tags.outputs.tag != ''
        run: |
          npm audit --audit-level=moderate
          npm run typecheck -- --force && npm run lint -- --force && npm test -- --force && npm run build -- --force

      - name: Commit to main and start the image build
        if: steps.tags.outputs.tag != ''
        env:
          TAG: ${{ steps.tags.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/types/package.json apps/web/package.json apps/api/package.json package-lock.json
          git commit -m "deps: @robyrew/chat-converter ${TAG}" \
            -m "Pin moved by .github/workflows/bump-chat-converter.yml; the job ran npm audit, typecheck, lint, test and build before this commit."
          git push origin HEAD:main
          gh workflow run build-images.yml --ref main
