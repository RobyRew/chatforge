# Image-only production deployment. Set all four *_IMAGE values to approved @sha256 digests.
# No ports are published: only web joins the existing Traefik network.
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  pids_limit: 64
  logging:
    driver: json-file
    options: {max-size: '5m', max-file: '2'}

services:
  postgres:
    <<: *runtime
    image: ${CHATFORGE_POSTGRES_IMAGE:?Set the approved PostgreSQL image digest}
    mem_limit: 128m
    cpus: 0.50
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatforge}
      POSTGRES_DB: ${POSTGRES_DB:-chatforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: ['postgres', '-c', 'max_connections=30', '-c', 'shared_buffers=32MB', '-c', 'password_encryption=scram-sha-256']
    volumes: ['chatforge-postgres:/var/lib/postgresql/data']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m', '/var/run/postgresql:rw,noexec,nosuid,size=4m,uid=70,gid=70']
    networks: [storage]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 90s
      start_period: 30s
      timeout: 5s
      retries: 3

  garage:
    <<: *runtime
    image: ${CHATFORGE_GARAGE_IMAGE:?Set the approved Garage image digest}
    mem_limit: 128m
    cpus: 0.50
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      S3_BUCKET: ${S3_BUCKET:-chatforge}
    volumes: ['chatforge-garage-data:/data', 'chatforge-garage-metadata:/metadata']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700']
    networks: [storage]

  api:
    <<: *runtime
    image: ${CHATFORGE_API_IMAGE:?Set the approved API image digest}
    mem_limit: 192m
    cpus: 0.75
    pids_limit: 96
    init: true
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=112
      NPM_CONFIG_CACHE: /tmp/npm
      PORT: 8787
      DATABASE_URL: ${DATABASE_URL:?required}
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:?required}
      LOGTO_APP_ID: ${LOGTO_APP_ID:?required}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET:?required}
      APP_BASE_URL: ${APP_BASE_URL:?required}
      CORS_ORIGIN: ${CORS_ORIGIN:?required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      S3_ENDPOINT: http://garage:3900
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-chatforge}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      BLOB_QUOTA_BYTES: ${BLOB_QUOTA_BYTES:-536870912}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=0700']
    networks: [storage, application]
    depends_on:
      postgres: {condition: service_healthy}
      garage: {condition: service_healthy}
    healthcheck:
      interval: 90s

  web:
    <<: *runtime
    image: ${CHATFORGE_WEB_IMAGE:?Set the approved web image digest}
    mem_limit: 32m
    cpus: 0.25
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101']
    networks: [application, dokploy-network]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      interval: 90s

volumes:
  # External volumes fail closed when absent instead of creating an empty database.
  chatforge-postgres:
    external: true
    name: ${CHATFORGE_POSTGRES_VOLUME:?Set the existing database volume name}
  chatforge-garage-data:
  chatforge-garage-metadata:
  # The old MinIO volume is deliberately not mounted or deleted.

networks:
  storage:
    internal: true
  application:
    # API requires outbound HTTPS to Logto and optional Spotify, but no host ports.
  dokploy-network:
    external: true
